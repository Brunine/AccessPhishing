[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phishforge-osint"
version = "0.1.0"
description = "PhishForge OSINT microservice: subdomain recon, lookalike-domain generation, availability (RDAP), and reputation (VirusTotal)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.35",
    "httpx>=0.27,<0.29",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "respx>=0.21,<0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Dependency locking (no requirements.txt drift):
#   uv pip compile pyproject.toml -o requirements.lock
#   uv pip compile --extra dev pyproject.toml -o requirements-dev.lock
# or, with pip-tools:
#   pip-compile --output-file=requirements.lock pyproject.toml
