openapi: 3.1.0
info:
  title: PhishForge Orchestrator API
  version: 0.9.1
  description: >
    0.8.0 adds M5 part 1: managed engine registry and lifecycle (/engines) backed by an out-of-process supervisor; start/stop return 503 when ENGINE_BINARY_PATH is unset.
servers:
  - url: /api/v1
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and database connectivity probe
      security: []
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: ok, db: ok, time: "2026-11-16T12:00:00Z" }
        "503":
          description: Dependency degraded (database unreachable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /tenants:
    post:
      operationId: createTenant
      summary: Create a tenant (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string }
            example: { name: "Acme Corp", slug: "acme" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listTenants
      summary: List tenants (admin)
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Tenant" } }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /tenants/{id}:
    get:
      operationId: getTenant
      summary: Get a tenant (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /tenants/{id}/summary:
    get:
      operationId: tenantSummary
      summary: Tenant portfolio KPI rollup (operator, own tenant only)
      description: >
        Read-only (M8). Aggregates funnel counts and rates across all of the
        caller's campaigns. 403 if {id} is not the caller's own tenant.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantSummary" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /campaigns:
    post:
      operationId: createCampaign
      summary: Create a campaign in the caller's tenant (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
            example: { name: "Q4 Awareness Sim" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listCampaigns
      summary: List the caller's tenant campaigns (operator)
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Campaign" } }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /campaigns/{id}:
    get:
      operationId: getCampaign
      summary: Get a campaign in the caller's tenant (operator)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateCampaignStatus
      summary: Transition a campaign's status (operator)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/CampaignStatus" }
            example: { status: "running" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /campaigns/{id}/launch:
    post:
      operationId: launchCampaign
      summary: Launch a draft campaign — snapshot recipients, go 'scheduled' (operator)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: provide group_id and/or contact_ids; suppressed addresses are skipped
              properties:
                group_id:    { type: string, format: uuid }
                contact_ids: { type: array, items: { type: string, format: uuid } }
                landing_url: { type: string, description: click redirect target }
            example: { group_id: "…", landing_url: "https://portal.example/awareness" }
      responses:
        "200":
          description: Launched
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign_id: { type: string, format: uuid }
                  status:      { type: string, enum: [scheduled] }
                  recipients:  { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Campaign is not in draft, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /campaigns/{id}/links:
    get:
      operationId: campaignLinks
      summary: Per-recipient tracking link + pixel URLs (operator)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        recipient_id: { type: string, format: uuid }
                        contact_id:   { type: string, format: uuid }
                        token:        { type: string }
                        click_url:    { type: string }
                        pixel_url:    { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /campaigns/{id}/send:
    post:
      operationId: sendCampaign
      summary: Enqueue delivery of a scheduled campaign (operator)
      description: Requires status 'scheduled' and an 'approved' approval for the campaign's template.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { type: object, properties: { campaign_id: { type: string, format: uuid }, status: { type: string, enum: [queued] } } } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { description: Template not approved, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Campaign not in 'scheduled', content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /campaigns/{id}/targets:
    get:
      operationId: campaignTargets
      summary: Per-recipient projected state for a campaign (operator)
      description: >
        Read-only. Recipients joined with their current campaign_targets state
        (defaulting to 'pending'). Added in 0.5.0 (unversioned bump) to back the
        M8-lite dashboard campaign-detail view.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        contact_id:    { type: string, format: uuid }
                        email:         { type: string }
                        first_name:    { type: string, nullable: true }
                        token:         { type: string }
                        state:         { type: string, enum: [pending, sent, delivered, opened, clicked, creds, session_hijacked, post_exploitation, bounced, failed] }
                        last_event_at: { type: string, format: date-time, nullable: true }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /campaigns/{id}/report:
    get:
      operationId: campaignReport
      summary: Campaign KPI report + timeline (operator)
      description: >
        Read-only (M8). Funnel counts/rates over recipients + campaign_targets
        and an event timeline bucketed by hour or day. No captured secret
        material is returned.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: bucket, in: query, required: false, schema: { type: string, enum: [hour, day], default: day } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignReport" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /campaigns/{id}/report.csv:
    get:
      operationId: campaignReportCSV
      summary: Flat per-recipient drilldown export (operator)
      description: >
        Read-only (M8). One row per recipient with current state and first-seen
        stage timestamps (sent/delivered/opened/clicked/creds/session_hijacked).
        No captured credentials or session material are included.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: CSV export
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /activity:
    get:
      operationId: activity
      summary: Recent audit entries and events for the tenant (operator)
      description: >
        Read-only dashboard activity feed. Added in 0.5.0 (unversioned bump) to
        back the M8-lite dashboard. Returns the most recent audit_log entries and
        victim-state events for the authenticated tenant.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  audit:
                    type: array
                    items:
                      type: object
                      properties:
                        id:          { type: string, format: uuid }
                        actor_email: { type: string, nullable: true }
                        action:      { type: string }
                        target_type: { type: string, nullable: true }
                        target_id:   { type: string, nullable: true }
                        metadata:    { type: object, additionalProperties: true, nullable: true }
                        created_at:  { type: string, format: date-time }
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id:          { type: string, format: uuid }
                        campaign_id: { type: string, format: uuid }
                        contact_id:  { type: string, format: uuid, nullable: true }
                        type:        { type: string }
                        occurred_at: { type: string, format: date-time }
                        created_at:  { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /llm/generate:
    post:
      operationId: llmGenerate
      summary: Generate a message draft via the LLM (operator)
      description: >
        Builds a server-owned prompt from the structured brief (fields are data,
        never system instructions), calls the Ollama host, and stores the result
        as an llm_drafts row (status 'draft'). Model output is data, never
        executed or auto-sent. Returns 503 when the LLM is unconfigured or the
        host is unreachable. When template_id is set the prompt is built from
        that stored prompt template (filled from variables) and topic is not
        required; otherwise the server-owned brief prompt is used (topic
        required). Added template_id/variables in 0.9.0.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:        { type: string, enum: [email, sms, landing], default: email }
                topic:       { type: string, description: required unless template_id is set }
                tone:        { type: string }
                notes:       { type: string }
                audience:    { type: string }
                name:        { type: string, description: optional draft name }
                template_id: { type: string, format: uuid, description: use a stored prompt template }
                variables:   { type: object, additionalProperties: { type: string }, description: values for the template's declared variables }
      responses:
        "201": { description: Draft created, content: { application/json: { schema: { $ref: "#/components/schemas/LLMDraft" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "503": { description: LLM unconfigured or unreachable, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /llm/drafts:
    get:
      operationId: listDrafts
      summary: List LLM drafts (operator)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/LLMDraft" } } } } } } }

  /llm/drafts/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      operationId: getDraft
      summary: Get an LLM draft (operator)
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LLMDraft" } } } }, "404": { $ref: "#/components/responses/Problem" } }

  /llm/drafts/{id}/promote:
    post:
      operationId: promoteDraft
      summary: Promote an approved draft into a template (operator)
      description: >
        Requires the draft to be approved via /approvals (subject_type
        'llm_draft'); 403 otherwise. Creates a templates row from the draft and
        marks the draft 'approved'.
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        "201": { description: Template created, content: { application/json: { schema: { $ref: "#/components/schemas/Template" } } } }
        "403": { description: Draft not approved, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Draft discarded or template name conflict, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /llm/drafts/{id}/discard:
    post:
      operationId: discardDraft
      summary: Discard an LLM draft (operator)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        "200": { description: Discarded, content: { application/json: { schema: { $ref: "#/components/schemas/LLMDraft" } } } }
        "404": { $ref: "#/components/responses/Problem" }

  /prompt-templates:
    post:
      operationId: createPromptTemplate
      summary: Create a prompt template (operator)
      description: >
        M6 (0.9.0). Declares variables up front; a user_template that references
        an undeclared variable is rejected (400) at save time. system_prompt is
        a literal instruction; only user_template is variable-substituted.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PromptTemplateInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PromptTemplate" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listPromptTemplates
      summary: List prompt templates (operator)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/PromptTemplate" } } } } } } }

  /prompt-templates/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      operationId: getPromptTemplate
      summary: Get a prompt template (operator)
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PromptTemplate" } } } }, "404": { $ref: "#/components/responses/Problem" } }
    patch:
      operationId: updatePromptTemplate
      summary: Update a prompt template (operator); re-validated
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PromptTemplateInput" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PromptTemplate" } } } }, "400": { $ref: "#/components/responses/Problem" }, "404": { $ref: "#/components/responses/Problem" }, "409": { $ref: "#/components/responses/Problem" } }
    delete:
      operationId: deletePromptTemplate
      summary: Delete a prompt template (operator)
      responses: { "204": { description: Deleted }, "404": { $ref: "#/components/responses/Problem" } }

  /prompt-templates/{id}/render:
    post:
      operationId: renderPromptTemplate
      summary: Dry-run render against a sample context (operator); no LLM call
      description: >
        Renders user_template with declared examples overlaid by any supplied
        variables and returns the text without contacting the LLM.
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                variables: { type: object, additionalProperties: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind:          { type: string }
                  system_prompt: { type: string }
                  rendered_user: { type: string }
                  prompt:        { type: string }
                  context:       { type: object, additionalProperties: { type: string } }
        "404": { $ref: "#/components/responses/Problem" }

  /templates:
    post:
      operationId: createTemplate
      summary: Create a message template (operator)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TemplateInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Template" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listTemplates
      summary: List templates (operator)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Template" } } } } } } }
  /templates/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      operationId: getTemplate
      summary: Get a template (operator)
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Template" } } } }, "404": { $ref: "#/components/responses/Problem" } }
    patch:
      operationId: updateTemplate
      summary: Update a template (operator)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TemplateInput" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Template" } } } }, "404": { $ref: "#/components/responses/Problem" } }
    delete:
      operationId: deleteTemplate
      summary: Delete a template (operator)
      responses: { "204": { description: Deleted }, "404": { $ref: "#/components/responses/Problem" } }

  /sending-profiles:
    post:
      operationId: createSendingProfile
      summary: Create a sending profile (smtp|graph|gmail); the secret is encrypted at rest (operator)
      description: >
        channel selects the transport (0.9.1). smtp requires smtp_host/smtp_port
        and uses smtp_pass; graph/gmail use from_address as the sender mailbox,
        optional api_tenant_id/api_client_id, and the secret field (falling back
        to the process GRAPH_* config). The per-channel secret is AES-256-GCM
        encrypted and never returned. gmail is accepted but not yet sending (M3
        part 2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, from_address]
              properties:
                name:          { type: string }
                channel:       { type: string, enum: [smtp, graph, gmail], default: smtp }
                smtp_host:     { type: string, description: required for smtp }
                smtp_port:     { type: integer, description: required for smtp }
                smtp_user:     { type: string }
                smtp_pass:     { type: string, description: smtp secret; write-only, encrypted, never returned }
                secret:        { type: string, description: API client secret for graph/gmail; write-only, encrypted }
                api_tenant_id: { type: string, description: e.g. Graph tenant id (non-secret) }
                api_client_id: { type: string, description: e.g. Graph client id (non-secret) }
                from_address:  { type: string, description: sender address / mailbox }
                from_name:     { type: string }
                tls_mode:      { type: string, enum: [none, starttls, smtps], default: starttls }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SendingProfile" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { description: Encryption key not configured }
    get:
      operationId: listSendingProfiles
      summary: List sending profiles (operator)
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/SendingProfile" } } } } } } } }
  /sending-profiles/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      operationId: getSendingProfile
      summary: Get a sending profile (operator)
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SendingProfile" } } } }, "404": { $ref: "#/components/responses/Problem" } }
    delete:
      operationId: deleteSendingProfile
      summary: Delete a sending profile (operator)
      responses: { "204": { description: Deleted }, "404": { $ref: "#/components/responses/Problem" } }

  /approvals:
    post:
      operationId: requestApproval
      summary: Request approval for a subject, e.g. a template (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [subject_type, subject_id], properties: { subject_type: { type: string }, subject_id: { type: string, format: uuid } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }, "400": { $ref: "#/components/responses/Problem" } }
    get:
      operationId: listApprovals
      summary: List approvals (operator)
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Approval" } } } } } } }
  /approvals/{id}/approve:
    post:
      operationId: approveApproval
      summary: Approve a pending approval (admin)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { "200": { description: Approved, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }, "403": { $ref: "#/components/responses/Problem" }, "404": { $ref: "#/components/responses/Problem" } }
  /approvals/{id}/reject:
    post:
      operationId: rejectApproval
      summary: Reject a pending approval (admin)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { "200": { description: Rejected, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }, "403": { $ref: "#/components/responses/Problem" }, "404": { $ref: "#/components/responses/Problem" } }

  /t/{token}:
    get:
      operationId: trackClick
      summary: Public click tracker — records 'clicked', 302 to landing
      description: >
        Token-authenticated by the path segment (no API key). Unknown tokens
        return a generic 404 page. Per-IP rate limited.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "302": { description: Redirect to the campaign landing URL }
        "200": { description: Neutral page (no landing URL configured) }
        "404": { description: Generic not-found page }
        "429": { $ref: "#/components/responses/Problem" }

  /px/{token}:
    get:
      operationId: trackOpen
      summary: Public open tracker — records 'opened', returns 1x1 GIF
      description: >
        Token-authenticated by the path segment (no API key). Always returns the
        pixel (even for unknown tokens) so it never reveals token validity.
        Per-IP rate limited.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 1x1 transparent GIF (Cache-Control no-store)
          content:
            image/gif: { schema: { type: string, format: binary } }
        "429": { $ref: "#/components/responses/Problem" }

  /contacts:
    post:
      operationId: createContact
      summary: Create a contact (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Contact" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listContacts
      summary: List contacts in the caller's tenant (operator)
      parameters:
        - { name: group_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Contact" } } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /contacts/import:
    post:
      operationId: importContacts
      summary: Bulk import contacts, skipping suppressed addresses (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contacts]
              properties:
                group_id: { type: string, format: uuid, description: applied to all imported contacts }
                contacts: { type: array, items: { $ref: "#/components/schemas/ContactInput" } }
      responses:
        "200": { description: Import summary, content: { application/json: { schema: { $ref: "#/components/schemas/ImportResult" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /contacts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getContact
      summary: Get a contact (operator)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Contact" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateContact
      summary: Replace a contact's fields (operator)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ContactInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Contact" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteContact
      summary: Delete a contact (operator)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }

  /contact-groups:
    post:
      operationId: createGroup
      summary: Create a contact group (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listGroups
      summary: List contact groups (operator)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Group" } } } } } } }

  /contact-groups/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getGroup
      summary: Get a contact group (operator)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteGroup
      summary: Delete a contact group; contacts are detached (operator)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }

  /suppressions:
    post:
      operationId: addSuppression
      summary: Add (or update) a suppressed address (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string }, reason: { type: string } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Suppression" } } } }
        "400": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listSuppressions
      summary: List suppressed addresses (operator)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Suppression" } } } } } } }
    delete:
      operationId: deleteSuppression
      summary: Remove a suppressed address by email (operator)
      parameters:
        - { name: email, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /engines:
    post:
      operationId: createEngine
      summary: Register an engine (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, config]
              properties:
                name: { type: string, maxLength: 200 }
                config: { type: string, description: "YAML engine config; see docs/ENGINE_CONFIG.md" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Engine" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listEngines
      summary: List engines (operator)
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Engine" } }, limit: { type: integer }, offset: { type: integer } } } } } }
  /engines/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      operationId: getEngine
      summary: Get an engine (operator)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Engine" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteEngine
      summary: Delete an engine (stops any live process first)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
  /engines/{id}/start:
    post:
      operationId: startEngine
      summary: Start an engine (operator); 503 when ENGINE_BINARY_PATH is unset
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Engine" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /engines/{id}/stop:
    post:
      operationId: stopEngine
      summary: Stop an engine (operator)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Engine" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /engines/{id}/logs:
    get:
      operationId: engineLogs
      summary: Tail engine stdout/stderr (bounded ring buffers, live process only)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { stdout: { type: string }, stderr: { type: string } } } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /engines/{id}/events:
    post:
      operationId: ingestEngineEvents
      summary: Engine capture-only event ingest (per-run bearer token)
      security: []          # authenticated by per-run bearer, not X-API-Key
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [events]
                  properties:
                    events:
                      type: array
                      items:
                        type: object
                        required: [recipient_token, kind]
                        properties:
                          engine_id:       { type: string }
                          recipient_token: { type: string, description: victim _pft token }
                          kind:            { type: string, enum: [creds, session] }
                          payload:
                            type: object
                            description: capture-only — only field/cookie NAMES are persisted
                          ts: { type: string, format: date-time }
                - type: object
                  required: [type, token]
                  description: legacy single-event shape
                  properties:
                    type: { type: string, enum: [creds, session_hijacked] }
                    token: { type: string }
                    occurred_at: { type: string, format: date-time }
                    payload: { type: object }
      responses:
        "200": {accepted, results[]}
        "202": { description: accepted }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }



components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Token of the form "pf_<keyID>.<secret>".
  responses:
    Problem:
      description: RFC 7807 error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Health:
      type: object
      required: [status, db, time]
      properties:
        status: { type: string, enum: [ok, degraded] }
        db:     { type: string, enum: [ok, down] }
        time:   { type: string, format: date-time }
    CampaignStatus:
      type: string
      enum: [draft, scheduled, running, paused, completed, archived]
    Tenant:
      type: object
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        slug:       { type: string }
        status:     { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Campaign:
      type: object
      properties:
        id:          { type: string, format: uuid }
        tenant_id:   { type: string, format: uuid }
        name:        { type: string }
        status:      { $ref: "#/components/schemas/CampaignStatus" }
        landing_url: { type: string, nullable: true }
        created_by:  { type: string, format: uuid }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }
    ReportTotals:
      type: object
      description: >
        Funnel counts over recipients. Each linear field counts recipients that
        reached that stage or beyond (the successful path); bounced/failed are
        reported separately and are not part of the funnel.
      properties:
        recipients:        { type: integer }
        pending:           { type: integer }
        sent:              { type: integer }
        delivered:         { type: integer }
        opened:            { type: integer }
        clicked:           { type: integer }
        creds:             { type: integer }
        session_hijacked:  { type: integer }
        post_exploitation: { type: integer }
        bounced:           { type: integer }
        failed:            { type: integer }
    ReportRates:
      type: object
      description: Funnel fractions of total recipients (0..1).
      properties:
        delivered:        { type: number, format: float }
        opened:           { type: number, format: float }
        clicked:          { type: number, format: float }
        creds:            { type: number, format: float }
        session_hijacked: { type: number, format: float }
    CampaignReport:
      type: object
      properties:
        campaign_id: { type: string, format: uuid }
        name:        { type: string }
        status:      { type: string }
        bucket:      { type: string, enum: [hour, day] }
        totals:      { $ref: "#/components/schemas/ReportTotals" }
        rates:       { $ref: "#/components/schemas/ReportRates" }
        timeline:
          type: array
          items:
            type: object
            properties:
              bucket: { type: string, format: date-time }
              counts: { type: object, additionalProperties: { type: integer } }
    TenantSummary:
      type: object
      properties:
        tenant_id: { type: string, format: uuid }
        totals:    { $ref: "#/components/schemas/ReportTotals" }
        rates:     { $ref: "#/components/schemas/ReportRates" }
        campaigns:
          type: array
          items:
            type: object
            properties:
              campaign_id: { type: string, format: uuid }
              name:        { type: string }
              status:      { type: string }
              totals:      { $ref: "#/components/schemas/ReportTotals" }
              rates:       { $ref: "#/components/schemas/ReportRates" }
    ContactInput:
      type: object
      required: [email]
      properties:
        email:      { type: string }
        first_name: { type: string }
        last_name:  { type: string }
        phone:      { type: string }
        group_id:   { type: string, format: uuid, nullable: true }
        attributes: { type: object, additionalProperties: true }
    Contact:
      type: object
      properties:
        id:         { type: string, format: uuid }
        tenant_id:  { type: string, format: uuid }
        group_id:   { type: string, format: uuid, nullable: true }
        email:      { type: string }
        first_name: { type: string, nullable: true }
        last_name:  { type: string, nullable: true }
        phone:      { type: string, nullable: true }
        attributes: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ImportResult:
      type: object
      properties:
        created:     { type: integer }
        duplicates:  { type: integer }
        suppressed:  { type: integer }
        created_ids: { type: array, items: { type: string, format: uuid } }
    Group:
      type: object
      properties:
        id:         { type: string, format: uuid }
        tenant_id:  { type: string, format: uuid }
        name:       { type: string }
        created_at: { type: string, format: date-time }
    Suppression:
      type: object
      properties:
        id:         { type: string, format: uuid }
        tenant_id:  { type: string, format: uuid }
        email:      { type: string }
        reason:     { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    TemplateInput:
      type: object
      required: [name, body]
      properties:
        kind:    { type: string, enum: [email, sms, landing, phishlet, script, voice], default: email }
        name:    { type: string }
        subject: { type: string }
        body:    { type: string, description: Go text/template, e.g. "Hi {{.first_name}} {{.link}}" }
    Template:
      type: object
      properties:
        id:         { type: string, format: uuid }
        tenant_id:  { type: string, format: uuid }
        kind:       { type: string }
        name:       { type: string }
        subject:    { type: string, nullable: true }
        body:       { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PromptVariable:
      type: object
      required: [name]
      properties:
        name:        { type: string, description: identifier [A-Za-z_][A-Za-z0-9_]* }
        example:     { type: string }
        description: { type: string }
    PromptTemplateInput:
      type: object
      required: [name, user_template]
      properties:
        name:          { type: string }
        kind:          { type: string, enum: [email, sms, landing], default: email }
        system_prompt: { type: string, description: literal instruction (not variable-substituted) }
        user_template: { type: string, description: "Go text/template; may only reference declared variables, e.g. {{.FirstName}}" }
        variables:     { type: array, items: { $ref: "#/components/schemas/PromptVariable" } }
        is_default:    { type: boolean }
    PromptTemplate:
      type: object
      properties:
        id:            { type: string, format: uuid }
        tenant_id:     { type: string, format: uuid }
        name:          { type: string }
        kind:          { type: string, enum: [email, sms, landing] }
        system_prompt: { type: string }
        user_template: { type: string }
        variables:     { type: array, items: { $ref: "#/components/schemas/PromptVariable" } }
        is_default:    { type: boolean }
        created_at:    { type: string, format: date-time }
        updated_at:    { type: string, format: date-time }
    LLMDraft:
      type: object
      description: An LLM-generated content record awaiting review. Promoted to a Template only after approval.
      properties:
        id:             { type: string, format: uuid }
        tenant_id:      { type: string, format: uuid }
        created_by:     { type: string, format: uuid, nullable: true }
        kind:           { type: string, enum: [email, sms, landing] }
        name:           { type: string }
        subject:        { type: string, nullable: true }
        body:           { type: string }
        model:          { type: string }
        prompt_summary: { type: string }
        status:         { type: string, enum: [draft, approved, rejected, discarded] }
        created_at:     { type: string, format: date-time }
        updated_at:     { type: string, format: date-time }
    SendingProfile:
      type: object
      description: The per-channel secret (smtp_pass / secret) is never returned.
      properties:
        id:            { type: string, format: uuid }
        tenant_id:     { type: string, format: uuid }
        name:          { type: string }
        channel:       { type: string, enum: [smtp, graph, gmail] }
        smtp_host:     { type: string }
        smtp_port:     { type: integer }
        smtp_user:     { type: string, nullable: true }
        api_tenant_id: { type: string, nullable: true }
        api_client_id: { type: string, nullable: true }
        from_address:  { type: string }
        from_name:     { type: string, nullable: true }
        tls_mode:      { type: string, enum: [none, starttls, smtps] }
        created_at:    { type: string, format: date-time }
        updated_at:    { type: string, format: date-time }
    Engine:
      type: object
      properties:
        id:         { type: string, format: uuid }
        tenant_id:  { type: string, format: uuid }
        name:       { type: string }
        config:     { type: string }
        status:     { type: string, enum: [stopped, starting, running, error, stopped_failed] }
        last_error: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Approval:
      type: object
      properties:
        id:           { type: string, format: uuid }
        tenant_id:    { type: string, format: uuid }
        subject_type: { type: string }
        subject_id:   { type: string, format: uuid }
        status:       { type: string, enum: [draft, approved, rejected, sent] }
        requested_by: { type: string, format: uuid, nullable: true }
        decided_by:   { type: string, format: uuid, nullable: true }
        decided_at:   { type: string, format: date-time, nullable: true }
        notes:        { type: string, nullable: true }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:     { type: string }
        title:    { type: string }
        status:   { type: integer }
        detail:   { type: string }
        instance: { type: string }
