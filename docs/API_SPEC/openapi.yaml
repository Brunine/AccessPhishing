openapi: 3.1.0
info:
  title: PhishForge Orchestrator API
  version: 0.3.0
  description: >
    M1 core + HTTP API layer + M2 target management. Auth is an X-API-Key dev
    identifier backed by hashed keys (api_keys). RBAC: tenants are admin-only
    (platform level); campaigns, contacts, contact-groups and suppressions
    require operator and are scoped to the caller's tenant (never a query
    param). Imports skip suppressed addresses. Every mutating endpoint writes
    an audit_log entry.
servers:
  - url: /api/v1
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and database connectivity probe
      security: []
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: ok, db: ok, time: "2026-11-16T12:00:00Z" }
        "503":
          description: Dependency degraded (database unreachable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /tenants:
    post:
      operationId: createTenant
      summary: Create a tenant (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string }
            example: { name: "Acme Corp", slug: "acme" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listTenants
      summary: List tenants (admin)
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Tenant" } }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /tenants/{id}:
    get:
      operationId: getTenant
      summary: Get a tenant (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /campaigns:
    post:
      operationId: createCampaign
      summary: Create a campaign in the caller's tenant (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
            example: { name: "Q4 Awareness Sim" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listCampaigns
      summary: List the caller's tenant campaigns (operator)
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Campaign" } }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /campaigns/{id}:
    get:
      operationId: getCampaign
      summary: Get a campaign in the caller's tenant (operator)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateCampaignStatus
      summary: Transition a campaign's status (operator)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/CampaignStatus" }
            example: { status: "running" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /contacts:
    post:
      operationId: createContact
      summary: Create a contact (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Contact" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listContacts
      summary: List contacts in the caller's tenant (operator)
      parameters:
        - { name: group_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Contact" } } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /contacts/import:
    post:
      operationId: importContacts
      summary: Bulk import contacts, skipping suppressed addresses (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contacts]
              properties:
                group_id: { type: string, format: uuid, description: applied to all imported contacts }
                contacts: { type: array, items: { $ref: "#/components/schemas/ContactInput" } }
      responses:
        "200": { description: Import summary, content: { application/json: { schema: { $ref: "#/components/schemas/ImportResult" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /contacts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getContact
      summary: Get a contact (operator)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Contact" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateContact
      summary: Replace a contact's fields (operator)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ContactInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Contact" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteContact
      summary: Delete a contact (operator)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }

  /contact-groups:
    post:
      operationId: createGroup
      summary: Create a contact group (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listGroups
      summary: List contact groups (operator)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Group" } } } } } } }

  /contact-groups/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getGroup
      summary: Get a contact group (operator)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteGroup
      summary: Delete a contact group; contacts are detached (operator)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }

  /suppressions:
    post:
      operationId: addSuppression
      summary: Add (or update) a suppressed address (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string }, reason: { type: string } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Suppression" } } } }
        "400": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listSuppressions
      summary: List suppressed addresses (operator)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Suppression" } } } } } } }
    delete:
      operationId: deleteSuppression
      summary: Remove a suppressed address by email (operator)
      parameters:
        - { name: email, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Token of the form "pf_<keyID>.<secret>".
  responses:
    Problem:
      description: RFC 7807 error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Health:
      type: object
      required: [status, db, time]
      properties:
        status: { type: string, enum: [ok, degraded] }
        db:     { type: string, enum: [ok, down] }
        time:   { type: string, format: date-time }
    CampaignStatus:
      type: string
      enum: [draft, scheduled, running, paused, completed, archived]
    Tenant:
      type: object
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        slug:       { type: string }
        status:     { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Campaign:
      type: object
      properties:
        id:         { type: string, format: uuid }
        tenant_id:  { type: string, format: uuid }
        name:       { type: string }
        status:     { $ref: "#/components/schemas/CampaignStatus" }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ContactInput:
      type: object
      required: [email]
      properties:
        email:      { type: string }
        first_name: { type: string }
        last_name:  { type: string }
        phone:      { type: string }
        group_id:   { type: string, format: uuid, nullable: true }
        attributes: { type: object, additionalProperties: true }
    Contact:
      type: object
      properties:
        id:         { type: string, format: uuid }
        tenant_id:  { type: string, format: uuid }
        group_id:   { type: string, format: uuid, nullable: true }
        email:      { type: string }
        first_name: { type: string, nullable: true }
        last_name:  { type: string, nullable: true }
        phone:      { type: string, nullable: true }
        attributes: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ImportResult:
      type: object
      properties:
        created:     { type: integer }
        duplicates:  { type: integer }
        suppressed:  { type: integer }
        created_ids: { type: array, items: { type: string, format: uuid } }
    Group:
      type: object
      properties:
        id:         { type: string, format: uuid }
        tenant_id:  { type: string, format: uuid }
        name:       { type: string }
        created_at: { type: string, format: date-time }
    Suppression:
      type: object
      properties:
        id:         { type: string, format: uuid }
        tenant_id:  { type: string, format: uuid }
        email:      { type: string }
        reason:     { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:     { type: string }
        title:    { type: string }
        status:   { type: integer }
        detail:   { type: string }
        instance: { type: string }
