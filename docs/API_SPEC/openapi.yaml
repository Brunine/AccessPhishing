openapi: 3.1.0
info:
  title: PhishForge Orchestrator API
  version: 0.16.0
  description: >
    0.16.0 adds M5 Phase 1: the in-process AiTM reverse proxy. POST
    /campaigns/{id}/proxy/start compiles the campaign's launch-bound application
    profile into a reverse proxy on a port from AITMPROXY_PORT_RANGE (one
    listener per campaign), fail-closed on an unauthorized engagement (403),
    missing bound profile (409), or a reserved auth/MFA method (409/501 — same
    mapping as launch). POST /proxy/stop tears it down; GET /proxy/status reports
    running state. Captured login fields and hijacked session cookies are
    recorded NAMES-ONLY via the existing engine-events ingest boundary
    (source="proxy"), stamped with the campaign's frozen profile checksum.
    0.14.0 adds M9b QR / quishing: a per-campaign `channel` (email|qr, default
    email), a `scanned` victim-state-machine step that slots in before clicked
    (scanned -> clicked -> creds -> ...), GET /campaigns/{id}/qrcodes returning
    per-recipient QR-code PNGs (base64, on the fly — no storage; audited
    qrcode.view), and a `scanned` report count + scanned_at drilldown timestamp.
    A qr-channel campaign's first /t/{token} hit records scanned then clicked;
    the scan event is on the qr channel, the click on email (like every click).
    0.13.0 adds M8d domain intelligence & procurement: engagement-scoped domain
    candidate discovery (POST /engagements/{id}/candidates/collect, async),
    deterministic ranking with registrar price comparison (GET
    /engagements/{id}/candidates, /registrars), and operator pick/reject
    (select/reject). Discovery is gated like campaign launch (403/409) and
    derives candidates only from the engagement's authorized_scope. Availability
    and pricing always come from verifiable sources (OSINT RDAP + registrar APIs);
    an optional LLM may only propose candidate names. No automated purchasing —
    the operator buys the picked candidate externally and imports it via /domains.
    0.11.0 adds M8b/M8c domain inventory (/domains): manual import of externally
    purchased domains, TXT-based ownership verification (_phishforge.<domain>),
    assignment to engagements with a separate admin authorization step, a
    verified -> active lifecycle, and live DNS/TLS diagnostics. Ownership
    (verification) and authorization (assignment) are enforced independently.
    0.10.0 adds M8a engagements (/engagements): the authorization container for
    campaigns. A campaign must be bound to an authorized, unexpired,
    non-terminated engagement before it can be launched or sent (403 when
    unbound/unauthorized, 409 when expired/terminated). 0.8.0 added M5 part 1:
    managed engine registry and lifecycle (/engines) backed by an out-of-process
    supervisor; start/stop return 503 when ENGINE_BINARY_PATH is unset.
servers:
  - url: /api/v1
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and database connectivity probe
      security: []
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: ok, db: ok, time: "2026-11-16T12:00:00Z" }
        "503":
          description: Dependency degraded (database unreachable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /tenants:
    post:
      operationId: createTenant
      summary: Create a tenant (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string }
            example: { name: "Acme Corp", slug: "acme" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listTenants
      summary: List tenants (admin)
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Tenant" } }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /tenants/{id}:
    get:
      operationId: getTenant
      summary: Get a tenant (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /tenants/{id}/summary:
    get:
      operationId: tenantSummary
      summary: Tenant portfolio KPI rollup (operator, own tenant only)
      description: >
        Read-only (M8). Aggregates funnel counts and rates across all of the
        caller's campaigns. 403 if {id} is not the caller's own tenant.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantSummary" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /tenants/{id}/summary.pdf:
    get:
      operationId: tenantSummaryPDF
      summary: Tenant executive report as PDF (operator, own tenant only)
      description: >
        M8 (0.9.3). Same aggregation as /tenants/{id}/summary, rendered as a
        paginated executive PDF (aggregate funnel, per-campaign rates, OSINT
        highlights — counts only). 403 if {id} is not the caller's own tenant.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /campaigns:
    post:
      operationId: createCampaign
      summary: Create a campaign in the caller's tenant (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                channel:
                  type: string
                  enum: [email, qr]
                  default: email
                  description: >
                    Delivery vector (M9b). Omit or 'email' for the standard
                    email/SMS flow; 'qr' for quishing. Any other value is 400.
                engagement_id:
                  type: string
                  format: uuid
                  description: >
                    Optional authorizing engagement (same tenant, 400 otherwise).
                    Required to be authorized/unexpired before launch or send.
            example: { name: "Q4 Awareness Sim", channel: "qr", engagement_id: "…" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listCampaigns
      summary: List the caller's tenant campaigns (operator)
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Campaign" } }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /campaigns/{id}:
    get:
      operationId: getCampaign
      summary: Get a campaign in the caller's tenant (operator)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateCampaign
      summary: Transition a campaign's status and/or bind its engagement (operator)
      description: >
        At least one of status / engagement_id must be present. Rebinding the
        engagement is only allowed while the campaign is still a draft (409
        after launch, to keep the authorization audit trail stable).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: "#/components/schemas/CampaignStatus" }
                engagement_id:
                  type: string
                  format: uuid
                  description: Same-tenant engagement to bind (400 otherwise); draft-only (409 after launch).
            example: { status: "running" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Cannot change the engagement after launch, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /campaigns/{id}/launch:
    post:
      operationId: launchCampaign
      summary: Launch a draft campaign — snapshot recipients, go 'scheduled' (operator)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                provide group_id and/or contact_ids; suppressed addresses are
                skipped. The campaign must already be bound to an authorized,
                unexpired engagement (gate order: engagement -> SMS phone -> snapshot).
              properties:
                group_id:    { type: string, format: uuid }
                contact_ids: { type: array, items: { type: string, format: uuid } }
                landing_url: { type: string, description: click redirect target }
                app_profile_id:
                  type: string
                  format: uuid
                  description: >
                    optional M10b application profile to bind. The profile's auth
                    method must be form/basic and its MFA mode none/totp_field
                    (else 409/501). Its checksum + version are frozen on the
                    campaign at launch (profile_checksum/profile_version).
            example: { group_id: "…", landing_url: "https://portal.example/awareness" }
      responses:
        "200":
          description: Launched
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign_id: { type: string, format: uuid }
                  status:      { type: string, enum: [scheduled] }
                  recipients:  { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { description: No bound engagement, or the bound engagement is not authorized, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: "Campaign not in draft; bound engagement expired/terminated; or AUTH-METHOD-UNSUPPORTED (bound profile's auth method is not form/basic)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "501": { description: "MFA-METHOD-UNSUPPORTED — bound profile's MFA mode is not none/totp_field", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /campaigns/{id}/links:
    get:
      operationId: campaignLinks
      summary: Per-recipient tracking link + pixel URLs (operator)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        recipient_id: { type: string, format: uuid }
                        contact_id:   { type: string, format: uuid }
                        token:        { type: string }
                        click_url:    { type: string }
                        pixel_url:    { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /campaigns/{id}/qrcodes:
    get:
      operationId: campaignQRCodes
      summary: Per-recipient QR codes of the tracking URLs (operator)
      description: >
        M9b quishing. Returns one QR-code artifact per recipient — each
        recipient's /t/{token} tracking URL encoded as a PNG, base64'd inline
        (qr_png_base64 + a ready-to-render data_uri). Generated on the fly from
        the campaign's recipients; nothing is stored. Read-but-audited
        (qrcode.view), like the report exports. Works for any campaign, but is
        intended for qr-channel campaigns: the operator prints/embeds the codes
        and uses them manually (there is no QR auto-send). Image size and EC
        level come from QR_SIZE / QR_EC_LEVEL. PDF/zip assembly is out of scope.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign_id: { type: string, format: uuid }
                  channel:     { type: string, enum: [email, qr] }
                  size:        { type: integer, description: QR PNG edge in pixels }
                  ec_level:    { type: string, enum: [L, M, Q, H] }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/QRCodeEntry" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /campaigns/{id}/send:
    post:
      operationId: sendCampaign
      summary: Enqueue delivery of a scheduled campaign (operator)
      description: >
        Requires status 'scheduled', a bound authorized+unexpired engagement
        (re-checked at send time — it may have expired or been terminated since
        launch), and an 'approved' approval for the campaign's template.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { type: object, properties: { campaign_id: { type: string, format: uuid }, status: { type: string, enum: [queued] } } } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { description: Template not approved, or no bound / unauthorized engagement, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Campaign not in 'scheduled', or the bound engagement is expired/terminated, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /campaigns/{id}/targets:
    get:
      operationId: campaignTargets
      summary: Per-recipient projected state for a campaign (operator)
      description: >
        Read-only. Recipients joined with their current campaign_targets state
        (defaulting to 'pending'). Added in 0.5.0 (unversioned bump) to back the
        M8-lite dashboard campaign-detail view.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        contact_id:    { type: string, format: uuid }
                        email:         { type: string }
                        first_name:    { type: string, nullable: true }
                        token:         { type: string }
                        state:         { type: string, enum: [pending, sent, delivered, opened, clicked, creds, session_hijacked, post_exploitation, bounced, failed] }
                        last_event_at: { type: string, format: date-time, nullable: true }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /campaigns/{id}/proxy/start:
    post:
      operationId: startCampaignProxy
      summary: Start the campaign's AiTM reverse proxy (operator)
      description: >
        M5 Phase 1. Compiles the campaign's launch-bound application profile
        (campaigns.app_profile_id) into an in-process reverse proxy and binds a
        port from AITMPROXY_PORT_RANGE (one listener per campaign). Fail closed:
        the campaign must be bound to an authorized, unexpired engagement (403
        unbound/unauthorized, 409 expired/terminated) and to a runtime-supported
        profile — a reserved auth method -> 409 (AUTH-METHOD-UNSUPPORTED), a
        reserved MFA mode -> 501 (MFA-METHOD-UNSUPPORTED), no bound profile ->
        409. Audited campaign.proxy.start.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Proxy running, content: { application/json: { schema: { $ref: "#/components/schemas/ProxyStatus" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /campaigns/{id}/proxy/stop:
    post:
      operationId: stopCampaignProxy
      summary: Stop the campaign's AiTM reverse proxy (operator)
      description: >
        M5 Phase 1. Gracefully tears down the running proxy and frees its port.
        409 when no proxy is running for the campaign. Audited campaign.proxy.stop.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Proxy stopped, content: { application/json: { schema: { $ref: "#/components/schemas/ProxyStatus" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /campaigns/{id}/proxy/status:
    get:
      operationId: campaignProxyStatus
      summary: AiTM reverse proxy running state (operator)
      description: Read-only. Reports whether a proxy is live for the campaign and, if so, its bound address/port and upstream.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProxyStatus" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /campaigns/{id}/report:
    get:
      operationId: campaignReport
      summary: Campaign KPI report + timeline (operator)
      description: >
        Read-only (M8). Funnel counts/rates over recipients + campaign_targets
        and an event timeline bucketed by hour or day. No captured secret
        material is returned.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: bucket, in: query, required: false, schema: { type: string, enum: [hour, day], default: day } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignReport" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /campaigns/{id}/report.csv:
    get:
      operationId: campaignReportCSV
      summary: Flat per-recipient drilldown export (operator)
      description: >
        Read-only (M8). One row per recipient with current state and first-seen
        stage timestamps (sent/delivered/opened/scanned/clicked/creds/
        session_hijacked). scanned_at is populated for QR scans (M9b). No
        captured credentials or session material are included.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: CSV export
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /campaigns/{id}/report.pdf:
    get:
      operationId: campaignReportPDF
      summary: Single-campaign executive report as PDF (operator)
      description: >
        M8 (0.9.3). Same aggregation as /campaigns/{id}/report plus the
        per-recipient drilldown, rendered as a paginated PDF (funnel, timeline
        table, recipients — states + timestamps only, no secret material).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: bucket, in: query, required: false, schema: { type: string, enum: [hour, day], default: day } }
      responses:
        "200": { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /engagements:
    post:
      operationId: createEngagement
      summary: Create an engagement (operator) — starts in 'draft'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EngagementInput" }
            example: { name: "Q1 Acme Test", client_name: "Acme Inc", authorized_scope: ["*.acme.com", "https://acme.com"], expires_at: "2026-12-31T23:59:59Z" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Engagement" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { description: Name already exists for the tenant, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    get:
      operationId: listEngagements
      summary: List the caller's tenant engagements, newest first (operator)
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Engagement" } }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /engagements/{id}:
    get:
      operationId: getEngagement
      summary: Get an engagement in the caller's tenant (operator)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Engagement" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: patchEngagement
      summary: Edit an engagement (operator) — draft/pending/authorized only
      description: Editing a terminated engagement is 409. name and client_name are required.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EngagementInput" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Engagement" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Terminated engagement cannot be edited, or name clash, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /engagements/{id}/request-authorization:
    post:
      operationId: requestEngagementAuthorization
      summary: Request authorization (operator) — draft|pending -> pending_authorization
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Engagement" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Not allowed from the current status, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /engagements/{id}/authorize:
    post:
      operationId: authorizeEngagement
      summary: Authorize an engagement (ADMIN) — pending_authorization -> authorized
      description: >
        Admin-only (self-authorization is impossible — the operator cannot reach
        this route). Sets authorized_at and authorized_by.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Engagement" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Not in 'pending_authorization', content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /engagements/{id}/terminate:
    post:
      operationId: terminateEngagement
      summary: Terminate an engagement — emergency stop (ADMIN)
      description: Admin-only. Any non-terminal engagement -> terminated (terminal; no re-authorization).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Engagement" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Already terminated, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /engagements/{id}/candidates/collect:
    post:
      operationId: collectCandidates
      summary: Discover domain candidates for an engagement (operator, async)
      description: >
        M8d. Enqueues a background discovery run that suggests lookalike candidate
        domains from the engagement's authorized_scope (via the OSINT service),
        fetches comparable registrar price quotes, and scores + ranks each
        candidate deterministically. Gated exactly like campaign launch: the
        engagement must be authorized (403 otherwise), unexpired and
        non-terminated (409 otherwise), and declare at least one authorized_scope
        entry (409 otherwise). Returns 202; poll GET .../candidates for results.
        No domain is ever purchased or registered — the operator picks a ranked
        candidate, buys it externally, and imports it via POST /domains.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: Discovery queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: queued }
                  engagement_id: { type: string, format: uuid }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { description: Engagement not authorized, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Engagement expired/terminated, or no authorized_scope, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "503": { description: OSINT service not configured, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /engagements/{id}/candidates:
    get:
      operationId: listCandidates
      summary: List an engagement's ranked domain candidates with price quotes (operator)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK (ordered by rank ascending, nulls last)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DomainCandidate" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /engagements/{id}/candidates/{cid}:
    get:
      operationId: getCandidate
      summary: Get one domain candidate with its price quotes (operator)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DomainCandidate" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /engagements/{id}/candidates/{cid}/select:
    post:
      operationId: selectCandidate
      summary: Pick a candidate to purchase externally (operator) — -> 'selected'
      description: Only a scored/suggested candidate can be selected (409 otherwise).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DomainCandidate" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Not selectable from the current status, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /engagements/{id}/candidates/{cid}/reject:
    post:
      operationId: rejectCandidate
      summary: Dismiss a candidate (operator) — -> 'rejected'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DomainCandidate" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Already rejected/imported, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /registrars:
    get:
      operationId: listRegistrars
      summary: List the registrar catalog used for price comparison (operator)
      description: Global, read-only registry of registrars that can be quoted from (porkbun/namecheap/cloudflare).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RegistrarProvider" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /domains:
    post:
      operationId: createDomain
      summary: Manually import an externally purchased domain (operator)
      description: >
        Imports a domain into the inventory. name is lowercase-normalized and
        validated as a bare domain. Lands in 'pending_verification' unless an
        explicit status (candidate|pending_purchase|pending_verification) is
        given for forward-compat. Ownership is established separately via TXT
        verification.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DomainInput" }
            example: { name: "phish-target.example", registrar: "namecheap" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Domain" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { description: Domain already exists for the tenant, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    get:
      operationId: listDomains
      summary: List the caller's tenant domains, newest first (operator)
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Domain" } }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /domains/{id}:
    get:
      operationId: getDomain
      summary: Get a domain in the caller's tenant (operator)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Domain" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: patchDomain
      summary: Edit domain metadata, with limited status transitions (operator)
      description: >
        Updates registrar/dates/dns_provider/nameservers/tls_status/notes. name
        is not editable (it anchors the verification hostname). An optional
        status change is limited to candidate->pending_purchase->pending_
        verification and (active|verified)->expired (only when expires_at is in
        the past); any other transition (including ->verified) is 409 — verified
        is reachable only through TXT verification, and active/suspended/retired
        through their dedicated endpoints.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DomainPatch" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Domain" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Status transition not permitted via PATCH, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    delete:
      operationId: deleteDomain
      summary: Hard-delete a domain (operator) — not allowed while active
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: An active domain cannot be deleted, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /domains/{id}/verification:
    post:
      operationId: createDomainVerification
      summary: Issue a TXT ownership challenge (operator)
      description: >
        Generates an opaque token and returns the TXT record to publish at
        _phishforge.<domain>. Any prior pending verification for the domain is
        expired. Allowed only while the domain is 'pending_verification'.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainVerificationChallenge" }
              example: { id: "…", hostname: "_phishforge.phish-target.example", token: "pf-domain-verify=…", txt_record: "pf-domain-verify=…" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Domain is not pending_verification, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /domains/{id}/verification/{vid}/check:
    post:
      operationId: checkDomainVerification
      summary: Check the published TXT record (operator)
      description: >
        Runs an exact-match TXT lookup against _phishforge.<domain>. On success
        the verification is marked verified and the domain is promoted
        pending_verification -> verified. On failure the verification is marked
        failed and the raw TXT records found are returned for debugging (still
        200). Re-checking a non-pending verification is 409.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: vid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:     { type: boolean }
                  txt_records:  { type: array, items: { type: string } }
                  lookup_error: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Verification or domain not in the required state, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /domains/{id}/assign:
    post:
      operationId: assignDomain
      summary: Attach a verified domain to an engagement (operator)
      description: >
        Creates a pending assignment. The domain must be at least verified (409
        otherwise) and the engagement must be same-tenant (400 otherwise) and
        authorized/active (409 otherwise). An admin authorizes the assignment
        separately.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [engagement_id]
              properties:
                engagement_id: { type: string, format: uuid }
                notes:         { type: string, nullable: true }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/DomainAssignment" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Domain not verified, engagement not authorized, or already assigned, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /domains/{id}/assignments:
    get:
      operationId: listDomainAssignments
      summary: List a domain's engagement assignments (operator)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DomainAssignment" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /domains/{id}/assignments/{aid}/authorize:
    post:
      operationId: authorizeDomainAssignment
      summary: Authorize a pending assignment (ADMIN) — pending -> authorized
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: aid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DomainAssignment" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Assignment not pending / already authorized, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /domains/{id}/assignments/{aid}/revoke:
    post:
      operationId: revokeDomainAssignment
      summary: Revoke an authorized assignment (ADMIN) — authorized -> revoked
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: aid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DomainAssignment" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Assignment not authorized, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /domains/{id}/activate:
    post:
      operationId: activateDomain
      summary: Activate a verified domain (ADMIN)
      description: >
        Requires the domain to be verified (or suspended, for reactivation) AND
        at least one authorized assignment. verified|suspended -> active.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Domain" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Not activatable / no authorized assignment, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /domains/{id}/suspend:
    post:
      operationId: suspendDomain
      summary: Suspend an active domain (ADMIN) — active -> suspended
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Domain" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Not active, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /domains/{id}/retire:
    post:
      operationId: retireDomain
      summary: Retire a domain (ADMIN) — any non-terminal -> retired (terminal)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Domain" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Already retired, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /domains/{id}/diagnostics:
    get:
      operationId: domainDiagnostics
      summary: Live DNS/TLS diagnostics for a domain (operator)
      description: >
        Read-only (no audit). Runs nameserver/SPF/DMARC lookups and a TLS
        handshake on port 443 against the stored domain name only (never a
        user-supplied host). DKIM is null (no selector configured yet). Lookup
        failures populate errors[]; soft issues (e.g. missing SPF on a verified
        domain) populate warnings[]; a non-resolving domain still returns 200.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DomainDiagnostics" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /activity:
    get:
      operationId: activity
      summary: Recent audit entries and events for the tenant (operator)
      description: >
        Read-only dashboard activity feed. Added in 0.5.0 (unversioned bump) to
        back the M8-lite dashboard. Returns the most recent audit_log entries and
        victim-state events for the authenticated tenant.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  audit:
                    type: array
                    items:
                      type: object
                      properties:
                        id:          { type: string, format: uuid }
                        actor_email: { type: string, nullable: true }
                        action:      { type: string }
                        target_type: { type: string, nullable: true }
                        target_id:   { type: string, nullable: true }
                        metadata:    { type: object, additionalProperties: true, nullable: true }
                        created_at:  { type: string, format: date-time }
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id:          { type: string, format: uuid }
                        campaign_id: { type: string, format: uuid }
                        contact_id:  { type: string, format: uuid, nullable: true }
                        type:        { type: string }
                        occurred_at: { type: string, format: date-time }
                        created_at:  { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /osint/status:
    get:
      operationId: osintStatus
      summary: OSINT service reachability (operator)
      description: >
        M7 (0.9.2). Health-checks the OSINT microservice. 503 when OSINT is
        unconfigured (OSINT_BASE_URL unset).
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { service: { type: string, enum: [ok, down] } } } } } }
        "503": { description: OSINT unconfigured, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /osint/collect:
    post:
      operationId: osintCollect
      summary: Collect passive OSINT for a domain and store it (operator)
      description: >
        M7 (0.9.2). Delegates to the OSINT microservice (passive public-info
        aggregation only — no scanning from the API): subdomain enumeration,
        lookalike generation, and RDAP availability of the lookalikes. The
        aggregate result is upserted into osint_results (one row per tenant+
        domain). 503 when OSINT is unconfigured or unreachable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
      responses:
        "201": { description: Collected, content: { application/json: { schema: { $ref: "#/components/schemas/OSINTResult" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "503": { description: OSINT unconfigured or unreachable, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /osint/results:
    get:
      operationId: osintResults
      summary: List stored OSINT results (operator)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/OSINTResult" } } } } } } }

  /llm/generate:
    post:
      operationId: llmGenerate
      summary: Generate a message draft via the LLM (operator)
      description: >
        Builds a server-owned prompt from the structured brief (fields are data,
        never system instructions), calls the Ollama host, and stores the result
        as an llm_drafts row (status 'draft'). Model output is data, never
        executed or auto-sent. Returns 503 when the LLM is unconfigured or the
        host is unreachable. When template_id is set the prompt is built from
        that stored prompt template (filled from variables) and topic is not
        required; otherwise the server-owned brief prompt is used (topic
        required). Added template_id/variables in 0.9.0.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:        { type: string, enum: [email, sms, landing], default: email }
                topic:       { type: string, description: required unless template_id is set }
                tone:        { type: string }
                notes:       { type: string }
                audience:    { type: string }
                name:        { type: string, description: optional draft name }
                template_id: { type: string, format: uuid, description: use a stored prompt template }
                variables:   { type: object, additionalProperties: { type: string }, description: values for the template's declared variables }
      responses:
        "201": { description: Draft created, content: { application/json: { schema: { $ref: "#/components/schemas/LLMDraft" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "503": { description: LLM unconfigured or unreachable, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /llm/drafts:
    get:
      operationId: listDrafts
      summary: List LLM drafts (operator)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/LLMDraft" } } } } } } }

  /llm/drafts/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      operationId: getDraft
      summary: Get an LLM draft (operator)
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LLMDraft" } } } }, "404": { $ref: "#/components/responses/Problem" } }

  /llm/drafts/{id}/promote:
    post:
      operationId: promoteDraft
      summary: Promote an approved draft into a template (operator)
      description: >
        Requires the draft to be approved via /approvals (subject_type
        'llm_draft'); 403 otherwise. Creates a templates row from the draft and
        marks the draft 'approved'.
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        "201": { description: Template created, content: { application/json: { schema: { $ref: "#/components/schemas/Template" } } } }
        "403": { description: Draft not approved, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Draft discarded or template name conflict, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /llm/drafts/{id}/discard:
    post:
      operationId: discardDraft
      summary: Discard an LLM draft (operator)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        "200": { description: Discarded, content: { application/json: { schema: { $ref: "#/components/schemas/LLMDraft" } } } }
        "404": { $ref: "#/components/responses/Problem" }

  /prompt-templates:
    post:
      operationId: createPromptTemplate
      summary: Create a prompt template (operator)
      description: >
        M6 (0.9.0). Declares variables up front; a user_template that references
        an undeclared variable is rejected (400) at save time. system_prompt is
        a literal instruction; only user_template is variable-substituted.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PromptTemplateInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PromptTemplate" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listPromptTemplates
      summary: List prompt templates (operator)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/PromptTemplate" } } } } } } }

  /prompt-templates/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      operationId: getPromptTemplate
      summary: Get a prompt template (operator)
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PromptTemplate" } } } }, "404": { $ref: "#/components/responses/Problem" } }
    patch:
      operationId: updatePromptTemplate
      summary: Update a prompt template (operator); re-validated
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PromptTemplateInput" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PromptTemplate" } } } }, "400": { $ref: "#/components/responses/Problem" }, "404": { $ref: "#/components/responses/Problem" }, "409": { $ref: "#/components/responses/Problem" } }
    delete:
      operationId: deletePromptTemplate
      summary: Delete a prompt template (operator)
      responses: { "204": { description: Deleted }, "404": { $ref: "#/components/responses/Problem" } }

  /prompt-templates/{id}/render:
    post:
      operationId: renderPromptTemplate
      summary: Dry-run render against a sample context (operator); no LLM call
      description: >
        Renders user_template with declared examples overlaid by any supplied
        variables and returns the text without contacting the LLM.
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                variables: { type: object, additionalProperties: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind:          { type: string }
                  system_prompt: { type: string }
                  rendered_user: { type: string }
                  prompt:        { type: string }
                  context:       { type: object, additionalProperties: { type: string } }
        "404": { $ref: "#/components/responses/Problem" }

  /platform/tenants:
    get:
      operationId: platformTenants
      summary: Cross-tenant KPI overview (platform admin)
      description: >
        M8/0.9.6. Lists ALL tenants with headline KPI rollups. admin is
        platform-level in this internal deployment (consistent with the existing
        cross-tenant /tenants endpoints). Read-only; counts/rates only.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/PlatformTenant" } } } } } } }
        "403": { $ref: "#/components/responses/Problem" }

  /platform/tenants/{id}/summary:
    get:
      operationId: platformTenantSummary
      summary: Any tenant's KPI rollup (platform admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TenantSummary" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /platform/tenants/{id}/summary.pdf:
    get:
      operationId: platformTenantSummaryPDF
      summary: Any tenant's executive PDF (platform admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /users:
    get:
      operationId: listUsers
      summary: List tenant users (operator)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/User" } } } } } } }
    post:
      operationId: createUser
      summary: Create a key-based user (admin)
      description: M1/0.9.5. Mirrors the seed tool — email + role, active, no password. Access is granted by minting an API key for the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string }
                role:  { type: string, enum: [admin, operator, viewer] }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /users/{id}/deactivate:
    post:
      operationId: deactivateUser
      summary: Deactivate a user (admin)
      description: >
        Sets the user inactive (its API keys stop authenticating). Refused with
        409 when it would leave the tenant with no active admin, or when the
        user is already inactive.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Deactivated, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Last active admin, or already inactive, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /profiles:
    get:
      operationId: listProfiles
      summary: List application profiles (operator)
      description: M10b/0.15.0. Tenant-scoped; newest first.
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AppProfile" } }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createProfile
      summary: Create a profile revision from a JSON {spec_yaml} envelope (operator)
      description: >
        M10b/0.15.0. The YAML is validated against every docs/PROFILES/VALIDATION.md
        rule; a new version N+1 is stored for the declared metadata.name. Reserved
        auth/MFA methods are storable (not import-blocked) but refused at launch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec_yaml]
              properties:
                spec_yaml: { type: string, description: the profile YAML document }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AppProfile" } } } }
        "400":
          description: Validation failed — body carries a violations[] array of {id, severity, message, path} with the exact rule IDs
          content: { application/json: { schema: { $ref: "#/components/schemas/ProfileValidationProblem" } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /profiles/import:
    post:
      operationId: importProfile
      summary: Import a profile revision from a raw YAML body (operator)
      description: M10b/0.15.0. Same semantics as POST /profiles; body is raw YAML (text/yaml). Stores version N+1.
      requestBody:
        required: true
        content:
          text/yaml:
            schema: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AppProfile" } } } }
        "400": { description: Validation failed, content: { application/json: { schema: { $ref: "#/components/schemas/ProfileValidationProblem" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /profiles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getProfile
      summary: Get a profile (operator)
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/AppProfile" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateProfile
      summary: Replace a profile revision's spec in place (operator)
      description: M10b/0.15.0. Re-validates. The version is unchanged; the checksum is recomputed. Does NOT affect already-launched campaigns' frozen stamps.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec_yaml]
              properties:
                spec_yaml: { type: string }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/AppProfile" } } } }
        "400": { description: Validation failed, content: { application/json: { schema: { $ref: "#/components/schemas/ProfileValidationProblem" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteProfile
      summary: Delete a profile (operator)
      description: Launched campaigns keep their frozen checksum (the FK is ON DELETE SET NULL).
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api-keys:
    get:
      operationId: listAPIKeys
      summary: List the tenant's API keys (operator)
      description: M1/0.9.4. Never returns secret material (no token/hash).
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/APIKey" } } } } } } }
    post:
      operationId: createAPIKey
      summary: Create an API key; the plaintext token is returned exactly once (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Created — token shown once
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:         { type: string, format: uuid }
                  name:       { type: string }
                  created_at: { type: string, format: date-time }
                  token:      { type: string, description: "pf_<id>.<secret>; returned once, never stored in plaintext" }
        "400": { $ref: "#/components/responses/Problem" }

  /api-keys/{id}/revoke:
    post:
      operationId: revokeAPIKey
      summary: Revoke an API key (operator)
      description: >
        Self-lockout guard: revoking the key the request authenticated with is
        refused (409) when it is the tenant's last active operator-capable
        (admin/operator) key.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Revoked, content: { application/json: { schema: { type: object, properties: { id: { type: string, format: uuid }, status: { type: string, enum: [revoked] } } } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Would self-lockout, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /templates:
    post:
      operationId: createTemplate
      summary: Create a message template (operator)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TemplateInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Template" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listTemplates
      summary: List templates (operator)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Template" } } } } } } }
  /templates/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      operationId: getTemplate
      summary: Get a template (operator)
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Template" } } } }, "404": { $ref: "#/components/responses/Problem" } }
    patch:
      operationId: updateTemplate
      summary: Update a template (operator)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TemplateInput" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Template" } } } }, "404": { $ref: "#/components/responses/Problem" } }
    delete:
      operationId: deleteTemplate
      summary: Delete a template (operator)
      responses: { "204": { description: Deleted }, "404": { $ref: "#/components/responses/Problem" } }

  /sending-profiles:
    post:
      operationId: createSendingProfile
      summary: Create a sending profile (smtp|graph|gmail|sms); the secret is encrypted at rest (operator)
      description: >
        channel selects the transport (0.9.1). smtp requires smtp_host/smtp_port
        and uses smtp_pass; graph/gmail use from_address as the sender mailbox,
        optional api_tenant_id/api_client_id, and the secret field (falling back
        to the process GRAPH_* config). sms (0.9.7) requires sms_provider
        (twilio) and sms_sender_id (the E.164 From / sender id), with
        api_client_id as the Twilio Account SID and secret as the auth token;
        from_address is not required for sms. The per-channel secret is
        AES-256-GCM encrypted and never returned. gmail is accepted but not yet
        sending (M3 part 2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:          { type: string }
                channel:       { type: string, enum: [smtp, graph, gmail, sms], default: smtp }
                smtp_host:     { type: string, description: required for smtp }
                smtp_port:     { type: integer, description: required for smtp }
                smtp_user:     { type: string }
                smtp_pass:     { type: string, description: smtp secret; write-only, encrypted, never returned }
                secret:        { type: string, description: API client secret (graph/gmail) or Twilio auth token (sms); write-only, encrypted }
                api_tenant_id: { type: string, description: e.g. Graph tenant id (non-secret) }
                api_client_id: { type: string, description: Graph client id, or Twilio Account SID for sms (non-secret) }
                sms_provider:  { type: string, enum: [twilio], description: required for sms }
                sms_sender_id: { type: string, description: "sms From / sender id (E.164, e.g. +15551234567); required for sms" }
                from_address:  { type: string, description: sender address / mailbox (required except for sms) }
                from_name:     { type: string }
                tls_mode:      { type: string, enum: [none, starttls, smtps], default: starttls }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SendingProfile" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { description: Encryption key not configured }
    get:
      operationId: listSendingProfiles
      summary: List sending profiles (operator)
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/SendingProfile" } } } } } } } }
  /sending-profiles/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      operationId: getSendingProfile
      summary: Get a sending profile (operator)
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SendingProfile" } } } }, "404": { $ref: "#/components/responses/Problem" } }
    delete:
      operationId: deleteSendingProfile
      summary: Delete a sending profile (operator)
      responses: { "204": { description: Deleted }, "404": { $ref: "#/components/responses/Problem" } }

  /approvals:
    post:
      operationId: requestApproval
      summary: Request approval for a subject, e.g. a template (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [subject_type, subject_id], properties: { subject_type: { type: string }, subject_id: { type: string, format: uuid } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }, "400": { $ref: "#/components/responses/Problem" } }
    get:
      operationId: listApprovals
      summary: List approvals (operator)
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Approval" } } } } } } } }
  /approvals/{id}/approve:
    post:
      operationId: approveApproval
      summary: Approve a pending approval (admin)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { "200": { description: Approved, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }, "403": { $ref: "#/components/responses/Problem" }, "404": { $ref: "#/components/responses/Problem" } }
  /approvals/{id}/reject:
    post:
      operationId: rejectApproval
      summary: Reject a pending approval (admin)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { "200": { description: Rejected, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }, "403": { $ref: "#/components/responses/Problem" }, "404": { $ref: "#/components/responses/Problem" } }

  /t/{token}:
    get:
      operationId: trackClick
      summary: Public click tracker — records 'clicked', 302 to landing
      description: >
        Token-authenticated by the path segment (no API key). Unknown tokens
        return a generic 404 page. Per-IP rate limited.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "302": { description: Redirect to the campaign landing URL }
        "200": { description: Neutral page (no landing URL configured) }
        "404": { description: Generic not-found page }
        "429": { $ref: "#/components/responses/Problem" }

  /px/{token}:
    get:
      operationId: trackOpen
      summary: Public open tracker — records 'opened', returns 1x1 GIF
      description: >
        Token-authenticated by the path segment (no API key). Always returns the
        pixel (even for unknown tokens) so it never reveals token validity.
        Per-IP rate limited.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 1x1 transparent GIF (Cache-Control no-store)
          content:
            image/gif: { schema: { type: string, format: binary } }
        "429": { $ref: "#/components/responses/Problem" }

  /contacts:
    post:
      operationId: createContact
      summary: Create a contact (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Contact" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listContacts
      summary: List contacts in the caller's tenant (operator)
      parameters:
        - { name: group_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Contact" } } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /contacts/import:
    post:
      operationId: importContacts
      summary: Bulk import contacts, skipping suppressed addresses (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contacts]
              properties:
                group_id: { type: string, format: uuid, description: applied to all imported contacts }
                contacts: { type: array, items: { $ref: "#/components/schemas/ContactInput" } }
      responses:
        "200": { description: Import summary, content: { application/json: { schema: { $ref: "#/components/schemas/ImportResult" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /contacts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getContact
      summary: Get a contact (operator)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Contact" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateContact
      summary: Replace a contact's fields (operator)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ContactInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Contact" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteContact
      summary: Delete a contact (operator)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }

  /contact-groups:
    post:
      operationId: createGroup
      summary: Create a contact group (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listGroups
      summary: List contact groups (operator)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Group" } } } } } } }

  /contact-groups/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getGroup
      summary: Get a contact group (operator)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteGroup
      summary: Delete a contact group; contacts are detached (operator)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }

  /suppressions:
    post:
      operationId: addSuppression
      summary: Add (or update) a suppressed address (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string }, reason: { type: string } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Suppression" } } } }
        "400": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listSuppressions
      summary: List suppressed addresses (operator)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Suppression" } } } } } } }
    delete:
      operationId: deleteSuppression
      summary: Remove a suppressed address by email (operator)
      parameters:
        - { name: email, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /engines:
    post:
      operationId: createEngine
      summary: Register an engine (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, config]
              properties:
                name: { type: string, maxLength: 200 }
                config: { type: string, description: "YAML engine config; see docs/ENGINE_CONFIG.md" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Engine" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listEngines
      summary: List engines (operator)
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Engine" } }, limit: { type: integer }, offset: { type: integer } } } } } }
  /engines/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      operationId: getEngine
      summary: Get an engine (operator)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Engine" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteEngine
      summary: Delete an engine (stops any live process first)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
  /engines/{id}/start:
    post:
      operationId: startEngine
      summary: Start an engine (operator); 503 when ENGINE_BINARY_PATH is unset
      description: >
        Resolves the engine's adapter by the config `kind` and starts the
        instance through it. In this build the kind-agnostic builtin
        local-subprocess adapter is the registry fallback, so any kind
        resolves; a strict (fallback-less) registry returns 400 for an
        unregistered kind (fail-closed). 409 when already running, 503 when no
        supervisor is wired.
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Engine" } } } }
        "400": { description: Unsupported engine kind (no adapter registered), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /engines/{id}/stop:
    post:
      operationId: stopEngine
      summary: Stop an engine (operator)
      description: >
        Stops the instance through its resolved adapter and records the
        lifecycle transition in the health snapshot.
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Engine" } } } }
        "400": { description: Unsupported engine kind (no adapter registered), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /engines/{id}/health:
    get:
      operationId: engineHealth
      summary: Engine runtime health/status (operator)
      description: >
        Read-only (not audited). Returns the adapter-reported health overlaid
        on the persisted snapshot and the authoritative engine row: the
        adapter-level status, the driving adapter kind, the declared engine
        kind, the DB engine_status, last transition time (set on start/stop),
        and last poll time (set by the worker's periodic health poller).
        `live` is true when this API instance currently supervises the process;
        otherwise status falls back to the snapshot, then to the engine row.
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EngineHealth" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /engines/{id}/logs:
    get:
      operationId: engineLogs
      summary: Tail engine stdout/stderr (bounded ring buffers, live process only)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { stdout: { type: string }, stderr: { type: string } } } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /engines/{id}/events:
    post:
      operationId: ingestEngineEvents
      summary: Engine capture-only event ingest (per-run bearer token)
      security: []          # authenticated by per-run bearer, not X-API-Key
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [events]
                  properties:
                    events:
                      type: array
                      items:
                        type: object
                        required: [recipient_token, kind]
                        properties:
                          engine_id:       { type: string }
                          recipient_token: { type: string, description: victim _pft token }
                          kind:            { type: string, enum: [creds, session] }
                          payload:
                            type: object
                            description: capture-only — only field/cookie NAMES are persisted
                          ts: { type: string, format: date-time }
                - type: object
                  required: [type, token]
                  description: legacy single-event shape
                  properties:
                    type: { type: string, enum: [creds, session_hijacked] }
                    token: { type: string }
                    occurred_at: { type: string, format: date-time }
                    payload: { type: object }
      responses:
        "200": { description: "Accepted; per-event results", content: { application/json: { schema: { type: object, properties: { accepted: { type: integer }, results: { type: array, items: { type: object } } } } } } }
        "202": { description: accepted }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }



components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Token of the form "pf_<keyID>.<secret>".
  responses:
    Problem:
      description: RFC 7807 error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Health:
      type: object
      required: [status, db, time]
      properties:
        status: { type: string, enum: [ok, degraded] }
        db:     { type: string, enum: [ok, down] }
        time:   { type: string, format: date-time }
    CampaignStatus:
      type: string
      enum: [draft, scheduled, running, paused, completed, archived]
    Tenant:
      type: object
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        slug:       { type: string }
        status:     { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PlatformTenant:
      type: object
      description: One tenant's headline rollup for the cross-tenant console.
      properties:
        tenant_id: { type: string, format: uuid }
        name:      { type: string }
        slug:      { type: string }
        campaigns: { type: integer }
        totals:    { $ref: "#/components/schemas/ReportTotals" }
        rates:     { $ref: "#/components/schemas/ReportRates" }
    User:
      type: object
      description: A key-based operator account (no password).
      properties:
        id:         { type: string, format: uuid }
        tenant_id:  { type: string, format: uuid }
        email:      { type: string }
        role:       { type: string, enum: [admin, operator, viewer] }
        active:     { type: boolean }
        created_at: { type: string, format: date-time }
    APIKey:
      type: object
      description: An API key record; secret material (token/hash) is never returned.
      properties:
        id:           { type: string, format: uuid }
        name:         { type: string }
        created_at:   { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at:   { type: string, format: date-time, nullable: true }
    Campaign:
      type: object
      properties:
        id:          { type: string, format: uuid }
        tenant_id:   { type: string, format: uuid }
        name:        { type: string }
        status:      { $ref: "#/components/schemas/CampaignStatus" }
        channel:
          type: string
          enum: [email, qr]
          description: >
            Delivery vector. 'email' (default; SMS campaigns are also 'email' at
            the campaign level — their SMS-ness comes from the bound sending
            profile) or 'qr' (M9b quishing). A qr campaign's first /t/{token} hit
            records a scanned event before the click.
        landing_url: { type: string, nullable: true }
        template_id:         { type: string, format: uuid, nullable: true }
        sending_profile_id:  { type: string, format: uuid, nullable: true }
        engine_id:           { type: string, format: uuid, nullable: true }
        engagement_id:
          type: string
          format: uuid
          nullable: true
          description: The authorizing engagement this campaign is bound to, if any.
        engagement_status:
          type: string
          nullable: true
          description: >
            Derived effective status label of the bound engagement
            (active/authorized/expired/terminated/draft/pending_authorization),
            populated on list/detail reads when an engagement is bound.
        created_by:  { type: string, format: uuid }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }
    QRCodeEntry:
      type: object
      description: >
        One recipient's QR artifact (M9b). The recipient's /t/{token} tracking
        URL encoded as a PNG QR code, base64'd inline. Generated on the fly — no
        image is stored. qr_png_base64 is the raw base64; data_uri wraps it as
        data:image/png;base64,… for direct <img> rendering.
      properties:
        recipient_id:  { type: string, format: uuid }
        contact_id:    { type: string, format: uuid }
        token:         { type: string }
        click_url:     { type: string, description: The encoded tracking URL. }
        qr_png_base64: { type: string, description: Base64 of the PNG QR image. }
        data_uri:      { type: string, description: "data:image/png;base64,<qr_png_base64>" }
    EngagementStatus:
      type: string
      description: >
        Stored lifecycle status. 'active' and 'expired' are DERIVED labels
        (see effective_status) and are not stored; stored values are draft,
        pending_authorization, authorized, terminated.
      enum: [draft, pending_authorization, authorized, active, expired, terminated]
    EngagementInput:
      type: object
      required: [name, client_name]
      description: Create/patch body for an engagement.
      properties:
        name:             { type: string, description: Unique per tenant. }
        client_name:      { type: string }
        roe_reference:    { type: string, nullable: true, description: Rules-of-Engagement document id/URL. }
        authorized_scope:
          type: array
          description: Authorized URL/domain scope (stored as data; validated as URLs or bare/wildcard domains).
          items: { type: string }
        starts_at:  { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        notes:      { type: string, nullable: true }
    Engagement:
      type: object
      description: >
        The authorization container for campaigns. A campaign must be bound to an
        authorized, unexpired, non-terminated engagement before launch or send.
      properties:
        id:               { type: string, format: uuid }
        tenant_id:        { type: string, format: uuid }
        name:             { type: string }
        client_name:      { type: string }
        status:           { $ref: "#/components/schemas/EngagementStatus" }
        effective_status:
          { $ref: "#/components/schemas/EngagementStatus" }
        roe_reference:    { type: string, nullable: true }
        authorized_scope: { type: array, items: { type: string } }
        authorized_at:    { type: string, format: date-time, nullable: true }
        authorized_by:    { type: string, format: uuid, nullable: true }
        starts_at:        { type: string, format: date-time, nullable: true }
        expires_at:       { type: string, format: date-time, nullable: true }
        notes:            { type: string, nullable: true }
        created_by:       { type: string, format: uuid }
        created_at:       { type: string, format: date-time }
        updated_at:       { type: string, format: date-time }
    DomainStatus:
      type: string
      description: >
        Domain lifecycle status. candidate/pending_purchase are forward-compat
        (M8d) import stages; manual import lands in pending_verification. verified
        is reachable only via TXT verification. authorized/expired double as
        reserved/derived labels; the stored path is pending_verification ->
        verified -> active.
      enum: [candidate, pending_purchase, pending_verification, verified, authorized, active, suspended, expired, retired]
    DomainInput:
      type: object
      required: [name]
      description: Manual-import body. Only name is required.
      properties:
        name:          { type: string, description: Lowercase-normalized bare domain, unique per tenant. }
        registrar:     { type: string, nullable: true }
        status:        { type: string, enum: [candidate, pending_purchase, pending_verification], description: Optional; defaults to pending_verification. }
        registered_at: { type: string, format: date-time, nullable: true }
        expires_at:    { type: string, format: date-time, nullable: true }
        dns_provider:  { type: string, nullable: true }
        nameservers:   { type: array, items: { type: string } }
        notes:         { type: string, nullable: true }
    DomainPatch:
      type: object
      description: Metadata + optional limited status change. name is not editable.
      properties:
        registrar:     { type: string, nullable: true }
        status:        { $ref: "#/components/schemas/DomainStatus" }
        registered_at: { type: string, format: date-time, nullable: true }
        expires_at:    { type: string, format: date-time, nullable: true }
        dns_provider:  { type: string, nullable: true }
        nameservers:   { type: array, items: { type: string } }
        tls_status:    { type: string, enum: [none, pending, valid, expiring, invalid], nullable: true }
        notes:         { type: string, nullable: true }
    Domain:
      type: object
      description: An inventory domain. Ownership (verification) and authorization (assignment) are independent.
      properties:
        id:            { type: string, format: uuid }
        tenant_id:     { type: string, format: uuid }
        name:          { type: string }
        registrar:     { type: string, nullable: true }
        status:        { $ref: "#/components/schemas/DomainStatus" }
        registered_at: { type: string, format: date-time, nullable: true }
        expires_at:    { type: string, format: date-time, nullable: true }
        dns_provider:  { type: string, nullable: true }
        nameservers:   { type: array, items: { type: string } }
        tls_status:    { type: string, nullable: true }
        notes:         { type: string, nullable: true }
        created_by:    { type: string, format: uuid }
        created_at:    { type: string, format: date-time }
        updated_at:    { type: string, format: date-time }
    DomainAssignment:
      type: object
      description: Binds a domain to an engagement. Operator attaches (pending); admin authorizes.
      properties:
        id:            { type: string, format: uuid }
        tenant_id:     { type: string, format: uuid }
        domain_id:     { type: string, format: uuid }
        engagement_id: { type: string, format: uuid }
        status:        { type: string, enum: [pending, authorized, revoked] }
        authorized_by: { type: string, format: uuid, nullable: true }
        authorized_at: { type: string, format: date-time, nullable: true }
        notes:         { type: string, nullable: true }
        created_at:    { type: string, format: date-time }
        updated_at:    { type: string, format: date-time }
    DomainVerificationChallenge:
      type: object
      description: The TXT record the operator must publish at hostname.
      properties:
        id:         { type: string, format: uuid }
        hostname:   { type: string, description: Always _phishforge.<domain>. }
        token:      { type: string, description: The full TXT value to publish. }
        txt_record: { type: string, description: Same value as token (pf-domain-verify=<hex>). }
    DomainDiagnostics:
      type: object
      description: Live DNS/TLS diagnostics result (read-only).
      properties:
        domain: { type: string }
        status: { type: string }
        dns:
          type: object
          properties:
            nameservers: { type: array, items: { type: string } }
            spf:         { type: string }
            dmarc:       { type: string }
            dkim:        { type: string, nullable: true }
            dkim_note:   { type: string }
        tls:
          type: object
          nullable: true
          properties:
            subject_cn:        { type: string }
            sans:              { type: array, items: { type: string } }
            issuer:            { type: string }
            not_before:        { type: string, format: date-time }
            not_after:         { type: string, format: date-time }
            days_until_expiry: { type: integer }
            covers_domain:     { type: boolean }
        ownership:
          type: object
          properties:
            verified: { type: boolean }
        warnings: { type: array, items: { type: string } }
        errors:   { type: array, items: { type: string } }
    CandidateScore:
      type: object
      description: >
        Deterministic scoring breakdown (M8d). value is the comparable ranking
        number (higher is better); it is a pure function of availability,
        inventory conflict, and the cheapest 3-year registrar cost. Never from an
        LLM.
      properties:
        value:              { type: number, description: "0..100; higher ranks better." }
        availability_base:  { type: number }
        cost_bonus:         { type: number }
        available:          { type: boolean, nullable: true, description: "RDAP availability (null when unknown)." }
        conflict:           { type: boolean, description: "True when the name already exists in the tenant's inventory (score 0)." }
        min_cost_3y_cents:  { type: integer, nullable: true, description: "Cheapest 3-year cost (first year + 2 renewals) in cents." }
        cheapest_registrar: { type: string }
        currency:           { type: string }
        reasons:            { type: array, items: { type: string } }
    DomainPriceQuote:
      type: object
      description: A normalized registrar price quote for a candidate. Prices are integer cents; null means unpriced.
      properties:
        id:               { type: string, format: uuid }
        candidate_id:     { type: string, format: uuid }
        registrar:        { type: string }
        currency:         { type: string }
        first_year_cents: { type: integer, nullable: true }
        renewal_cents:    { type: integer, nullable: true }
        transfer_cents:   { type: integer, nullable: true }
        available:        { type: boolean, nullable: true }
        quoted_at:        { type: string, format: date-time }
        created_at:       { type: string, format: date-time }
    DomainCandidate:
      type: object
      description: A suggested candidate domain for an engagement, with a deterministic score and price quotes.
      properties:
        id:            { type: string, format: uuid }
        tenant_id:     { type: string, format: uuid }
        engagement_id: { type: string, format: uuid }
        source:        { type: string, enum: [lookalike, llm], description: "Where the name came from. LLM names are advisory only." }
        name:          { type: string }
        fuzzer:        { type: string, nullable: true }
        available:     { type: boolean, nullable: true }
        score:         { $ref: "#/components/schemas/CandidateScore" }
        rank:          { type: integer, nullable: true, description: "1-based; lower is better." }
        status:        { type: string, enum: [suggested, scored, selected, rejected, imported] }
        notes:         { type: string, nullable: true }
        created_by:    { type: string, format: uuid, nullable: true }
        created_at:    { type: string, format: date-time }
        updated_at:    { type: string, format: date-time }
        quotes:        { type: array, items: { $ref: "#/components/schemas/DomainPriceQuote" } }
    RegistrarProvider:
      type: object
      description: A registrar the platform can obtain comparable price quotes from.
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        api_kind:   { type: string, enum: [porkbun, namecheap, cloudflare, manual] }
        enabled:    { type: boolean }
        base_url:   { type: string, nullable: true }
        notes:      { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    ReportTotals:
      type: object
      description: >
        Funnel counts over recipients. Each linear field counts recipients that
        reached that stage or beyond (the successful path); bounced/failed/scanned
        are reported separately and are not part of the funnel.
      properties:
        recipients:        { type: integer }
        pending:           { type: integer }
        sent:              { type: integer }
        delivered:         { type: integer }
        opened:            { type: integer }
        scanned:
          type: integer
          description: >
            Recipients currently resting at 'scanned' — a QR scan (M9b) with no
            click yet. The common scan→click flow lands on 'clicked', so the
            richer per-scan signal is in the timeline (scanned event counts) and
            the per-recipient drilldown (scanned_at). Not a linear funnel stage.
        clicked:           { type: integer }
        creds:             { type: integer }
        session_hijacked:  { type: integer }
        post_exploitation: { type: integer }
        bounced:           { type: integer }
        failed:            { type: integer }
    ReportRates:
      type: object
      description: Funnel fractions of total recipients (0..1).
      properties:
        delivered:        { type: number, format: float }
        opened:           { type: number, format: float }
        clicked:          { type: number, format: float }
        creds:            { type: number, format: float }
        session_hijacked: { type: number, format: float }
    CampaignReport:
      type: object
      properties:
        campaign_id: { type: string, format: uuid }
        name:        { type: string }
        status:      { type: string }
        bucket:      { type: string, enum: [hour, day] }
        totals:      { $ref: "#/components/schemas/ReportTotals" }
        rates:       { $ref: "#/components/schemas/ReportRates" }
        timeline:
          type: array
          items:
            type: object
            properties:
              bucket: { type: string, format: date-time }
              counts: { type: object, additionalProperties: { type: integer } }
    TenantSummary:
      type: object
      properties:
        tenant_id: { type: string, format: uuid }
        totals:    { $ref: "#/components/schemas/ReportTotals" }
        rates:     { $ref: "#/components/schemas/ReportRates" }
        campaigns:
          type: array
          items:
            type: object
            properties:
              campaign_id: { type: string, format: uuid }
              name:        { type: string }
              status:      { type: string }
              totals:      { $ref: "#/components/schemas/ReportTotals" }
              rates:       { $ref: "#/components/schemas/ReportRates" }
    ContactInput:
      type: object
      required: [email]
      properties:
        email:      { type: string }
        first_name: { type: string }
        last_name:  { type: string }
        phone:      { type: string }
        phone_e164: { type: string, description: "E.164 phone (^\\+[1-9][0-9]{7,14}$); enables SMS. On import an invalid value is dropped." }
        group_id:   { type: string, format: uuid, nullable: true }
        attributes: { type: object, additionalProperties: true }
    Contact:
      type: object
      properties:
        id:         { type: string, format: uuid }
        tenant_id:  { type: string, format: uuid }
        group_id:   { type: string, format: uuid, nullable: true }
        email:      { type: string }
        first_name: { type: string, nullable: true }
        last_name:  { type: string, nullable: true }
        phone:      { type: string, nullable: true }
        phone_e164: { type: string, nullable: true, description: E.164 phone; enables SMS }
        attributes: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ImportResult:
      type: object
      properties:
        created:     { type: integer }
        duplicates:  { type: integer }
        suppressed:  { type: integer }
        created_ids: { type: array, items: { type: string, format: uuid } }
    Group:
      type: object
      properties:
        id:         { type: string, format: uuid }
        tenant_id:  { type: string, format: uuid }
        name:       { type: string }
        created_at: { type: string, format: date-time }
    Suppression:
      type: object
      properties:
        id:         { type: string, format: uuid }
        tenant_id:  { type: string, format: uuid }
        email:      { type: string }
        reason:     { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    TemplateInput:
      type: object
      required: [name, body]
      properties:
        kind:    { type: string, enum: [email, sms, landing, phishlet, script, voice], default: email }
        name:    { type: string }
        subject: { type: string, description: ignored for sms (plain text only) }
        body:    { type: string, description: 'Go text/template, e.g. "Hi {{.first_name}} {{.link}}". For kind=sms the body is plain text and must be <= 1600 characters (400 otherwise).' }
    Template:
      type: object
      properties:
        id:         { type: string, format: uuid }
        tenant_id:  { type: string, format: uuid }
        kind:       { type: string }
        name:       { type: string }
        subject:    { type: string, nullable: true }
        body:       { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PromptVariable:
      type: object
      required: [name]
      properties:
        name:        { type: string, description: "identifier [A-Za-z_][A-Za-z0-9_]*" }
        example:     { type: string }
        description: { type: string }
    PromptTemplateInput:
      type: object
      required: [name, user_template]
      properties:
        name:          { type: string }
        kind:          { type: string, enum: [email, sms, landing], default: email }
        system_prompt: { type: string, description: literal instruction (not variable-substituted) }
        user_template: { type: string, description: "Go text/template; may only reference declared variables, e.g. {{.FirstName}}" }
        variables:     { type: array, items: { $ref: "#/components/schemas/PromptVariable" } }
        is_default:    { type: boolean }
    PromptTemplate:
      type: object
      properties:
        id:            { type: string, format: uuid }
        tenant_id:     { type: string, format: uuid }
        name:          { type: string }
        kind:          { type: string, enum: [email, sms, landing] }
        system_prompt: { type: string }
        user_template: { type: string }
        variables:     { type: array, items: { $ref: "#/components/schemas/PromptVariable" } }
        is_default:    { type: boolean }
        created_at:    { type: string, format: date-time }
        updated_at:    { type: string, format: date-time }
    ProxyStatus:
      type: object
      description: >
        M5 AiTM proxy running state for a campaign. running is false when no
        proxy is live; the remaining fields are present only while running.
      properties:
        running:    { type: boolean }
        addr:       { type: string, description: "host:port the listener is bound to" }
        port:       { type: integer, description: allocated port from AITMPROXY_PORT_RANGE }
        started_at: { type: string, format: date-time }
        upstream:   { type: string, description: "scheme://host:port the proxy forwards to (the real login origin)" }
      required: [running]
    AppProfile:
      type: object
      description: >
        M10b application profile — the validated runtime contract for the M5 AiTM
        proxy (docs/PROFILES/SCHEMA.md). version is a monotonic revision per
        (tenant, name); spec is the canonical JSON of the validated document;
        checksum is the sha256 hex of that canonical spec.
      properties:
        id:         { type: string, format: uuid }
        tenant_id:  { type: string, format: uuid }
        name:       { type: string }
        version:    { type: integer }
        spec:       { type: object, description: canonical JSON of the validated profile }
        checksum:   { type: string, description: sha256 hex of the canonical spec }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProfileValidationProblem:
      type: object
      description: 400 body when a profile fails validation; violations carry the exact VALIDATION.md rule IDs.
      properties:
        type:   { type: string }
        title:  { type: string }
        status: { type: integer }
        detail: { type: string }
        violations:
          type: array
          items:
            type: object
            properties:
              id:       { type: string, description: VALIDATION.md rule ID (e.g. AUTH-METHOD-REQUIRED) }
              severity: { type: string, enum: [error, warn] }
              message:  { type: string }
              path:     { type: string }
    OSINTResult:
      type: object
      description: A stored OSINT collection (one per tenant+domain; recollect upserts).
      properties:
        id:         { type: string, format: uuid }
        tenant_id:  { type: string, format: uuid }
        domain:     { type: string }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        result:
          type: object
          description: Aggregated passive collection (mirrors the OSINT service's shapes).
          properties:
            domain:           { type: string }
            subdomain_source: { type: string }
            subdomains:       { type: array, items: { type: string } }
            lookalikes:
              type: array
              items:
                type: object
                properties:
                  domain: { type: string }
                  fuzzer: { type: string }
            availability:
              type: array
              items:
                type: object
                properties:
                  domain:      { type: string }
                  available:   { type: boolean, nullable: true }
                  status_code: { type: integer, nullable: true }
    LLMDraft:
      type: object
      description: An LLM-generated content record awaiting review. Promoted to a Template only after approval.
      properties:
        id:             { type: string, format: uuid }
        tenant_id:      { type: string, format: uuid }
        created_by:     { type: string, format: uuid, nullable: true }
        kind:           { type: string, enum: [email, sms, landing] }
        name:           { type: string }
        subject:        { type: string, nullable: true }
        body:           { type: string }
        model:          { type: string }
        prompt_summary: { type: string }
        status:         { type: string, enum: [draft, approved, rejected, discarded] }
        created_at:     { type: string, format: date-time }
        updated_at:     { type: string, format: date-time }
    SendingProfile:
      type: object
      description: The per-channel secret (smtp_pass / secret) is never returned.
      properties:
        id:            { type: string, format: uuid }
        tenant_id:     { type: string, format: uuid }
        name:          { type: string }
        channel:       { type: string, enum: [smtp, graph, gmail, sms] }
        smtp_host:     { type: string }
        smtp_port:     { type: integer }
        smtp_user:     { type: string, nullable: true }
        api_tenant_id: { type: string, nullable: true }
        api_client_id: { type: string, nullable: true, description: Twilio Account SID for sms }
        sms_provider:  { type: string, nullable: true, enum: [twilio] }
        sms_sender_id: { type: string, nullable: true, description: sms From / sender id }
        from_address:  { type: string }
        from_name:     { type: string, nullable: true }
        tls_mode:      { type: string, enum: [none, starttls, smtps] }
        created_at:    { type: string, format: date-time }
        updated_at:    { type: string, format: date-time }
    Engine:
      type: object
      properties:
        id:         { type: string, format: uuid }
        tenant_id:  { type: string, format: uuid }
        name:       { type: string }
        config:     { type: string }
        status:     { type: string, enum: [stopped, starting, running, error, stopped_failed] }
        last_error: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EngineHealth:
      type: object
      description: >
        Runtime health for one engine. The adapter-level status vocabulary is
        distinct from the engine_status enum: it is what the driving adapter
        reports about the live instance, mapped onto a durable snapshot.
      properties:
        engine_id:          { type: string, format: uuid }
        status:             { type: string, enum: [unknown, starting, running, stopped, failed], description: Adapter-reported health. }
        detail:             { type: string, description: Adapter-reported detail (e.g. pid, exit error). }
        live:               { type: boolean, description: True when this API instance supervises the process. }
        adapter_kind:       { type: string, description: The driving adapter (builtin in this build). }
        engine_kind:        { type: string, description: The kind declared in the engine config. }
        engine_status:      { type: string, enum: [stopped, starting, running, error, stopped_failed], description: Authoritative DB engine status. }
        last_transition_at: { type: string, format: date-time, nullable: true, description: Last start/stop transition. }
        last_poll_at:       { type: string, format: date-time, nullable: true, description: Last worker health-poll tick. }
        started_at:         { type: string, format: date-time, nullable: true }
        last_error:         { type: string, nullable: true }
    Approval:
      type: object
      properties:
        id:           { type: string, format: uuid }
        tenant_id:    { type: string, format: uuid }
        subject_type: { type: string }
        subject_id:   { type: string, format: uuid }
        status:       { type: string, enum: [draft, approved, rejected, sent] }
        requested_by: { type: string, format: uuid, nullable: true }
        decided_by:   { type: string, format: uuid, nullable: true }
        decided_at:   { type: string, format: date-time, nullable: true }
        notes:        { type: string, nullable: true }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:     { type: string }
        title:    { type: string }
        status:   { type: integer }
        detail:   { type: string }
        instance: { type: string }
