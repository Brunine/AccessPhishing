name: phishforge-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phishforge
      POSTGRES_PASSWORD: ${PG_PASSWORD:-devpass}
      POSTGRES_DB: phishforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishforge"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postal:
    image: postalio/postal:latest
    profiles: ["mail"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: