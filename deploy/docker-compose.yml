name: phishforge-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phishforge
      POSTGRES_PASSWORD: ${PG_PASSWORD:-devpass}
      POSTGRES_DB: phishforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishforge"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postal:
    image: postalio/postal:latest
    profiles: ["mail"]
    depends_on:
      postgres:
        condition: service_healthy

  osint:
    build:
      context: ../services/osint-py
    profiles: ["osint"]
    environment:
      OSINT_TOKEN: ${OSINT_TOKEN:-}
      OSINT_MAX_CANDIDATES: ${OSINT_MAX_CANDIDATES:-500}
      VT_API_KEY: ${VT_API_KEY:-}
      RDAP_TIMEOUT: ${RDAP_TIMEOUT:-10}
    # Published only on the host loopback; the service itself binds 0.0.0.0
    # inside the container.
    ports:
      - "127.0.0.1:8099:8099"

volumes:
  pgdata: